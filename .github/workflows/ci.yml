name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Flutter apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: |
          for app in client_app worker_app admin_app_complt_app; do
            (cd "client_side/$app" && flutter pub get)
          done
      - name: Analyze customer app
        run: cd client_side/client_app && flutter analyze
      - name: Build customer app for web
        run: cd client_side/client_app && flutter build web --release

  server:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: cd server_side/online_store_api && npm install --no-package-lock --no-audit --no-fund
      - name: Syntax check
        run: cd server_side/online_store_api && node --check index.js
